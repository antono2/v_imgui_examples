name: Portable release packages
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        variant: [docking, standard]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      VMODULES: ${{ github.workspace }}/build/modules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Resolve tested compatibility manifest
        id: compat
        shell: bash
        run: |
          python scripts/test_distribution.py
          python scripts/compatibility.py --github-output "$GITHUB_OUTPUT" --variant "${{ matrix.variant }}"
      - uses: ./.github/actions/setup-v
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: antono2/imgui
          ref: ${{ steps.compat.outputs.module_imgui }}
          path: build/modules/antono2/imgui
          submodules: recursive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: antono2/vulkan
          ref: ${{ steps.compat.outputs.module_vulkan }}
          path: build/modules/antono2/vulkan
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: antono2/glfw
          ref: ${{ steps.compat.outputs.module_glfw }}
          path: build/modules/antono2/glfw
      - name: Verify the declared dependency graph
        shell: bash
        run: |
          python scripts/test_installed_deps.py
          v run scripts/check_installed_deps.vsh --tag-override 'antono2.imgui=${{ steps.compat.outputs.module_imgui }}'
          python scripts/compatibility.py --variant "${{ matrix.variant }}" --modules build/modules
      - name: Install Linux build and rendering tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libglfw3-dev libvulkan-dev libvulkan-volk-dev libdbus-1-dev libatk1.0-dev libatk-bridge2.0-dev libatspi2.0-dev libglib2.0-dev at-spi2-core dbus-x11 pkg-config mesa-vulkan-drivers vulkan-validationlayers ripgrep gdb xvfb patchelf zip xdotool openbox x11-utils x11-xserver-utils wmctrl
      - name: Install Windows Vulkan build tools
        if: runner.os == 'Windows'
        shell: bash
        run: v run build/modules/antono2/imgui/scripts/setup_vulkan_ci.vsh ${{ steps.compat.outputs.ci_sdk }} ${{ steps.compat.outputs.ci_runtime }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: runner.os == 'Windows'
        with:
          repository: zeux/volk
          ref: ${{ steps.compat.outputs.volk }}
          path: build/volk
      - name: Install Windows Volk header
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Destination = Join-Path $env:VULKAN_SDK 'Include/volk'
          New-Item -ItemType Directory -Force $Destination | Out-Null
          Copy-Item build/volk/volk.h, build/volk/volk.c $Destination
      - name: Build, bundle and render Linux releases
        if: runner.os == 'Linux'
        run: ./scripts/build_release.v '${{ matrix.variant }}'
      - name: Exercise bundled gallery through native AT-SPI
        if: runner.os == 'Linux'
        run: |
          c++ -std=c++17 tests/desktop/accessibility.cpp $(pkg-config --cflags --libs atspi-2 gio-2.0) -o build/accessibility-check
          GSETTINGS_BACKEND=memory dbus-run-session -- xvfb-run -a build/accessibility-check "build/v-imgui-examples-linux-x64-${{ matrix.variant }}/widget_gallery" "build/release-atspi-${{ matrix.variant }}.log"
      - name: Check bundled desktop keyboard shortcuts
        if: runner.os == 'Linux'
        run: |
          sudo sysctl kernel.yama.ptrace_scope=0
          ./tests/desktop/shortcuts.sh "build/v-imgui-examples-linux-x64-${{ matrix.variant }}"
      - name: Build and audit Windows release DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . scripts/setup_windows_build.ps1
          v -prod run scripts/build_release.v '${{ matrix.variant }}'
          if ($LASTEXITCODE -ne 0) { throw 'Portable release build failed' }
          & "build/v-imgui-examples-windows-x64-${{ matrix.variant }}/examples.exe" --help
          if ($LASTEXITCODE -ne 0) { throw 'Examples launcher failed' }
      - name: Exercise native Windows UI Automation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . scripts/setup_windows_build.ps1
          cl.exe /nologo /std:c++17 /EHsc tests/desktop/windows_text.cpp /Febuild/windows-text-check.exe /Fobuild/windows-text-check.obj /link uiautomationcore.lib ole32.lib oleaut32.lib
          if ($LASTEXITCODE -ne 0) { throw 'Native text probe build failed' }
          powershell.exe -Mta -NoProfile -ExecutionPolicy Bypass -File tests/desktop/accessibility.ps1 -Executable "build/v-imgui-examples-windows-x64-${{ matrix.variant }}/widget_gallery.exe" -SelectionProbe "$PWD/build/windows-text-check.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Native UI Automation check failed' }
      - name: Upload portable desktop package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-${{ runner.os }}-${{ matrix.variant }}
          path: build/v-imgui-examples-*.zip
          if-no-files-found: error
      - name: Upload rendering logs
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: render-${{ matrix.variant }}
          path: |
            build/v-imgui-examples-linux-*/smoke-logs
            build/v-imgui-examples-linux-*/shortcut-logs

  android:
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86_64]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_ABI: ${{ matrix.abi }}
      VIMGUI_ANDROID_APPLICATION_UI: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-v
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install Android build tools
        run: |
          sdkmanager --install 'ndk;27.3.13750724' 'platforms;android-36' 'build-tools;36.0.0'
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"
      - name: Build accessible touch app
        run: bash scripts/build_android.sh --build-only
      - name: Collect Android notices
        run: ./scripts/collect_licenses.v build/modules/antono2/imgui "build/android-touch-$ANDROID_ABI/licenses" android
      - name: Upload unsigned APK and notices for release signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-release-input-${{ matrix.abi }}
          path: |
            build/android-touch-${{ matrix.abi }}/vimgui-demo-unsigned.apk
            build/android-touch-${{ matrix.abi }}/licenses
          if-no-files-found: error

  package-consumer:
    name: Package consumer (${{ matrix.platform }}, ${{ matrix.variant }})
    needs: desktop
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        variant: [docking, standard]
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: |
            scripts/test_release_package.py
            scripts/compatibility.py
            compatibility.json
            v.mod
          sparse-checkout-cone-mode: false
      - name: Resolve consumer runtime pins
        id: compat
        shell: bash
        run: python scripts/compatibility.py --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: desktop-${{ runner.os }}-${{ matrix.variant }}
          path: downloads
      - name: Install Windows software Vulkan driver
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl --fail --location --retry 3 https://raw.githubusercontent.com/antono2/vulkan/refs/tags/${{ steps.compat.outputs.module_vulkan }}/.github/scripts/setup-vulkan-ci.sh --output "$RUNNER_TEMP/setup-vulkan-ci.sh"
          bash "$RUNNER_TEMP/setup-vulkan-ci.sh" ${{ steps.compat.outputs.ci_sdk }} ${{ steps.compat.outputs.ci_runtime }}
      - name: Test Windows package with runtime-only environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Archives = @(Get-ChildItem downloads -Filter '*.zip')
          if ($Archives.Count -ne 1) { throw 'Expected exactly one package archive' }
          python scripts/test_release_package.py $Archives[0].FullName --project imgui  --logs package-smoke-logs
          if ($LASTEXITCODE -ne 0) { throw 'Windows package consumer failed' }
      - name: Test Linux package in a runtime-only Ubuntu container
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p package-smoke-logs
          docker run --rm --init -v "$PWD:/consumer" -w /consumer ubuntu:24.04 bash -euxc '
            apt-get update
            apt-get install -y --no-install-recommends python3 xvfb xauth mesa-vulkan-drivers libvulkan1 vulkan-validationlayers
            if command -v v; then exit 1; fi
            if command -v cmake; then exit 1; fi
            if command -v cc; then exit 1; fi
            if dpkg-query -W libglfw3 2>/dev/null; then exit 1; fi
            mapfile -t archives < <(find downloads -maxdepth 1 -type f \( -name "*.zip" -o -name "*.tar.gz" \))
            test "${#archives[@]}" -eq 1
            VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation timeout --kill-after=10s 8m xvfb-run -a python3 -u scripts/test_release_package.py "${archives[0]}" --project imgui  --logs package-smoke-logs
          '
      - name: Preserve consumer logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: consumer-${{ matrix.platform }}-${{ matrix.variant }}
          path: package-smoke-logs
          if-no-files-found: warn
