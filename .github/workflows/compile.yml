name: Compile example

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu24:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VMODULES: ${{ github.workspace }}/source/modules
      VULKAN_SDK: /usr
      GLFW_INCLUDE: /usr/include
      GLFW_LIB: /usr/lib/x86_64-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          path: source/demo
      - uses: actions/checkout@v7
        with:
          repository: antono2/imgui
          path: source/modules/antono2/imgui
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          repository: antono2/vulkan
          path: source/modules/antono2/vulkan
      - uses: actions/checkout@v7
        with:
          repository: antono2/glfw
          path: source/modules/antono2/glfw
      - uses: actions/checkout@v7
        with:
          repository: vlang/v
          ref: 1f128c94619fb6e4863c5f81883e1b860405c8fa
          path: toolchain/v
      - name: Build official V compiler
        working-directory: toolchain/v
        run: |
          make
          echo "$GITHUB_WORKSPACE/toolchain/v" >> "$GITHUB_PATH"
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libglfw3-dev libvulkan-dev libvulkan-volk-dev pkg-config
      - name: Build native ImGui library
        working-directory: source/modules/antono2/imgui
        run: v run build_vimgui.vsh --linkage shared --glfw system
      - name: Compile GLFW/Vulkan example
        run: |
          v -check-syntax source/demo/setup.vsh
          v -no-memory-limit -path "$GITHUB_WORKSPACE/source/modules/antono2|@vlib|@vmodules" -cc gcc -o "$RUNNER_TEMP/v_imgui_demo" source/demo
      - name: Verify executable
        run: test -x "$RUNNER_TEMP/v_imgui_demo"

  windows2022:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      VMODULES: ${{ github.workspace }}/source/modules
    steps:
      - uses: actions/checkout@v7
        with:
          path: source/demo
      - uses: actions/checkout@v7
        with:
          repository: antono2/imgui
          path: source/modules/antono2/imgui
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          repository: antono2/vulkan
          ref: d9ad9fc5151aa19f58cd2fed1b6bcda9b210f098
          path: source/modules/antono2/vulkan
      - uses: actions/checkout@v7
        with:
          repository: antono2/glfw
          ref: 3d7c1ddacb7215a7bbeb5fef0d7a68c90ba392ed
          path: source/modules/antono2/glfw
      - uses: actions/checkout@v7
        with:
          repository: vlang/v
          ref: 1f128c94619fb6e4863c5f81883e1b860405c8fa
          path: toolchain/v
      - uses: actions/checkout@v7
        with:
          repository: zeux/volk
          ref: 58689c063427f5bad4f133625049b1a3c5dd8287
          path: source/third_party/volk
      - name: Build official V compiler
        shell: cmd
        working-directory: toolchain/v
        run: makev.bat
      - name: Add V compiler to PATH
        shell: pwsh
        run: |
          "$env:GITHUB_WORKSPACE\toolchain\v" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Vulkan SDK and SwiftShader test artifacts
        shell: bash
        run: bash source/modules/antono2/imgui/.github/scripts/setup-vulkan-ci.sh 1.4.309.0 v1.2
      - name: Install matching Volk header
        shell: pwsh
        run: |
          $Destination = Join-Path $env:VULKAN_SDK 'Include\volk'
          New-Item -ItemType Directory -Force $Destination | Out-Null
          Copy-Item source/third_party/volk/volk.h, source/third_party/volk/volk.c $Destination
      - name: Build native libraries and compile the example
        shell: pwsh
        run: |
          $VsWhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $InstallPath = & $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $InstallPath) { throw 'Visual Studio C++ tools were not found' }
          Import-Module (Join-Path $InstallPath 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $InstallPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'

          $ImguiRoot = Join-Path $env:GITHUB_WORKSPACE 'source\modules\antono2\imgui'
          v -check-syntax (Join-Path $env:GITHUB_WORKSPACE 'source\demo\setup.vsh')
          v run (Join-Path $ImguiRoot 'build_vimgui.vsh') --linkage shared --glfw bundled --glfw-version 3.4
          if ($LASTEXITCODE -ne 0) { throw 'Could not build the native ImGui library' }

          $NativeBuild = Join-Path $ImguiRoot 'build\shared-bundled-3.4'
          $GlfwHeader = Get-ChildItem $NativeBuild -Recurse -Filter 'glfw3.h' |
            Where-Object { $_.FullName -match 'glfw-src.*include.GLFW' } | Select-Object -First 1
          $GlfwLibrary = Get-ChildItem $NativeBuild -Recurse -Include 'glfw3dll.lib', 'glfw3.lib' | Select-Object -First 1
          $GlfwDll = Get-ChildItem $NativeBuild -Recurse -Filter 'glfw3.dll' | Select-Object -First 1
          $VimguiDll = Get-ChildItem (Join-Path $ImguiRoot 'lib') -Recurse -Filter 'vimgui.dll' | Select-Object -First 1
          if (-not $GlfwHeader -or -not $GlfwLibrary -or -not $GlfwDll -or -not $VimguiDll) {
            throw 'The native build did not produce all required Windows artifacts'
          }

          $LinkDirectory = Join-Path $env:RUNNER_TEMP 'link'
          New-Item -ItemType Directory -Force $LinkDirectory | Out-Null
          Copy-Item $GlfwLibrary.FullName (Join-Path $LinkDirectory 'glfw3.lib')
          $env:GLFW_INCLUDE = Split-Path -Parent (Split-Path -Parent $GlfwHeader.FullName)
          $env:GLFW_LIB = $LinkDirectory
          $Executable = Join-Path $env:RUNNER_TEMP 'v_imgui_demo.exe'
          $ModulePath = "$env:GITHUB_WORKSPACE\source\modules\antono2|@vlib|@vmodules"
          v -no-memory-limit -path $ModulePath -cc msvc -o $Executable source/demo
          if ($LASTEXITCODE -ne 0) { throw 'The Windows example did not compile' }
          foreach ($Artifact in @($Executable, $GlfwDll.FullName, $VimguiDll.FullName)) {
            if (-not (Test-Path $Artifact)) { throw "Missing Windows artifact: $Artifact" }
          }

  required-checks:
    if: always()
    needs: [ubuntu24, windows2022]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required jobs
        env:
          UBUNTU_RESULT: ${{ needs.ubuntu24.result }}
          WINDOWS_RESULT: ${{ needs.windows2022.result }}
        run: |
          test "$UBUNTU_RESULT" = success
          test "$WINDOWS_RESULT" = success
