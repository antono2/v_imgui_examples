name: Compile example

on:
  push:
    paths-ignore: ['**/*.md']
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ubuntu24:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VMODULES: ${{ github.workspace }}/source/modules
      VULKAN_SDK: /usr
      GLFW_INCLUDE: /usr/include
      GLFW_LIB: /usr/lib/x86_64-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source/demo
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
          install-dependencies: false
      - name: Resolve compatibility manifest
        id: compat
        shell: bash
        run: |
          v run source/demo/scripts/doctor.vsh --self-test
          v run source/demo/scripts/compatibility.vsh --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/imgui
          ref: ${{ steps.compat.outputs.module_imgui }}
          path: source/modules/antono2/imgui
          submodules: recursive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/vulkan
          ref: ${{ steps.compat.outputs.module_vulkan }}
          path: source/modules/antono2/vulkan
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/glfw
          ref: ${{ steps.compat.outputs.module_glfw }}
          path: source/modules/antono2/glfw
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/v
          ref: ${{ steps.compat.outputs.v }}
          path: toolchain/v
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/vc
          ref: ${{ steps.compat.outputs.vc }}
          path: toolchain/v/vc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/tccbin
          ref: ${{ steps.compat.outputs.tcc }}
          path: toolchain/v/thirdparty/tcc
      - name: Build official V compiler
        working-directory: toolchain/v
        run: |
          make local=1
          echo "$GITHUB_WORKSPACE/toolchain/v" >> "$GITHUB_PATH"
      - name: Verify the declared dependency graph
        shell: bash
        run: v run source/demo/scripts/check_installed_deps.vsh
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libglfw3-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libvulkan-dev libvulkan-volk-dev pkg-config mesa-vulkan-drivers vulkan-validationlayers xvfb openbox xdotool x11-utils x11-xserver-utils wmctrl gdb
      - name: Build native ImGui library
        working-directory: source/modules/antono2/imgui
        run: v run build_vimgui.vsh --linkage shared --glfw system
      - name: Compile desktop examples
        run: |
          v -check-syntax source/demo/setup.vsh
          ./source/demo/setup.vsh --help
          v run source/demo/scripts/build_desktop.vsh --output "$RUNNER_TEMP" -no-memory-limit \
            -path "$GITHUB_WORKSPACE/source/modules/antono2|@vlib|@vmodules" -cc gcc
      - name: Render desktop examples with Vulkan validation
        run: v run source/demo/scripts/smoke_desktop.vsh "$RUNNER_TEMP"
      - name: Check native window startup recovery
        run: v run source/demo/tests/desktop/window_startup.v "$RUNNER_TEMP/glfw_vulkan"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: glfw/glfw
          ref: ${{ steps.compat.outputs.glfw }}
          path: source/native-glfw
      - name: Build declared GLFW version with local Xlib loading
        run: |
          cmake -S source/native-glfw -B source/native-glfw-build -DBUILD_SHARED_LIBS=ON -DGLFW_BUILD_WAYLAND=OFF -DGLFW_BUILD_EXAMPLES=OFF -DGLFW_BUILD_TESTS=OFF -DGLFW_BUILD_DOCS=OFF
          cmake --build source/native-glfw-build --parallel 2
      - name: Check native startup without globally linked Xlib
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/source/native-glfw-build/src
          VIMGUI_STARTUP_LOCAL_XLIB: '1'
        run: v run source/demo/tests/desktop/window_startup.v "$RUNNER_TEMP/glfw_vulkan" "$RUNNER_TEMP/startup-glfw34-logs"
      - name: Check desktop keyboard shortcuts
        run: |
          sudo sysctl kernel.yama.ptrace_scope=0
          v run source/demo/tests/desktop/shortcuts.vsh "$RUNNER_TEMP" --raw-gallery
      - name: Preserve window startup diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: startup-source-linux
          path: |
            ${{ runner.temp }}/startup-logs
            ${{ runner.temp }}/startup-glfw34-logs
            ${{ runner.temp }}/shortcut-logs
          if-no-files-found: ignore
      - name: Verify executable
        run: test -x "$RUNNER_TEMP/glfw_vulkan" && test -x "$RUNNER_TEMP/widget_gallery" && test -x "$RUNNER_TEMP/implot_dashboard"

  windows2022:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      VMODULES: ${{ github.workspace }}/source/modules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source/demo
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
          install-dependencies: false
      - name: Resolve compatibility manifest
        id: compat
        shell: bash
        run: |
          v run source/demo/scripts/doctor.vsh --self-test
          v run source/demo/scripts/compatibility.vsh --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/imgui
          ref: ${{ steps.compat.outputs.module_imgui }}
          path: source/modules/antono2/imgui
          submodules: recursive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/vulkan
          ref: ${{ steps.compat.outputs.module_vulkan }}
          path: source/modules/antono2/vulkan
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/glfw
          ref: ${{ steps.compat.outputs.module_glfw }}
          path: source/modules/antono2/glfw
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/v
          ref: ${{ steps.compat.outputs.v }}
          path: toolchain/v
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/vc
          ref: ${{ steps.compat.outputs.vc }}
          path: toolchain/v/vc
      - name: Set up MSVC x64
        uses: antono2/vulkan/.github/actions/setup-msvc@23ec75dc6015776f3012880148ca90e66f63010a
      - name: Build official V compiler
        shell: cmd
        working-directory: toolchain/v
        run: makev.bat -msvc --local
      - name: Add V compiler to PATH
        shell: pwsh
        run: |
          "$env:GITHUB_WORKSPACE\toolchain\v" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify the declared dependency graph
        shell: bash
        run: v run source/demo/scripts/check_installed_deps.vsh
      - name: Install Vulkan SDK, SwiftShader and matching Volk
        uses: antono2/vulkan/.github/actions/setup-vulkan-ci@23ec75dc6015776f3012880148ca90e66f63010a
        with:
          sdk-version: ${{ steps.compat.outputs.ci_sdk }}
          artifact-tag: ${{ steps.compat.outputs.ci_runtime }}
          volk-revision: ${{ steps.compat.outputs.volk }}
      - name: Build and compile Windows examples
        run: v run source/demo/scripts/build_windows_ci.vsh "$env:RUNNER_TEMP\examples"

      - name: Upload Windows examples
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-examples
          path: ${{ runner.temp }}/examples
          if-no-files-found: error

  strict-v3-frontend:
    name: Required pinned V3 frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VMODULES: ${{ github.workspace }}/source/modules
      VULKAN_SDK: /usr
      GLFW_INCLUDE: /usr/include
      GLFW_LIB: /usr/lib/x86_64-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source/demo
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
          install-dependencies: false
      - name: Resolve compatibility manifest
        id: compat
        shell: bash
        run: |
          v run source/demo/scripts/doctor.vsh --self-test
          v run source/demo/scripts/compatibility.vsh --github-output "$GITHUB_OUTPUT" --compiler v3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/imgui
          ref: ${{ steps.compat.outputs.module_imgui }}
          path: source/modules/antono2/imgui
          submodules: recursive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/vulkan
          ref: ${{ steps.compat.outputs.module_vulkan }}
          path: source/modules/antono2/vulkan
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/glfw
          ref: ${{ steps.compat.outputs.module_glfw }}
          path: source/modules/antono2/glfw
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/v
          ref: ${{ steps.compat.outputs.v }}
          path: toolchain/v
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/vc
          ref: ${{ steps.compat.outputs.vc }}
          path: toolchain/v/vc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/tccbin
          ref: ${{ steps.compat.outputs.tcc }}
          path: toolchain/v/thirdparty/tcc
      - name: Build pinned V3 compiler
        run: |
          make -C toolchain/v local=1
          echo "$GITHUB_WORKSPACE/toolchain/v" >> "$GITHUB_PATH"
      - name: Verify the declared dependency graph
        shell: bash
        run: v run source/demo/scripts/check_installed_deps.vsh
      - name: Check desktop examples with V3
        run: v run source/demo/scripts/build_desktop.vsh --check -new-compiler -path "$VMODULES/antono2|@vlib|@vmodules"

  linux-v-master:
    name: Advisory current V master and dependency masters
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VMODULES: ${{ github.workspace }}/source/modules
      VULKAN_SDK: /usr
      GLFW_INCLUDE: /usr/include
      GLFW_LIB: /usr/lib/x86_64-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source/demo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/imgui
          ref: master
          path: source/modules/antono2/imgui
          submodules: recursive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/vulkan
          ref: master
          path: source/modules/antono2/vulkan
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/glfw
          ref: master
          path: source/modules/antono2/glfw
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/v
          ref: master
          path: toolchain/v
      - name: Build current V master
        run: |
          make -C toolchain/v
          echo "$GITHUB_WORKSPACE/toolchain/v" >> "$GITHUB_PATH"
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libglfw3-dev libvulkan-dev libvulkan-volk-dev pkg-config mesa-vulkan-drivers vulkan-validationlayers xvfb
      - name: Stage headers matching Vulkan master
        run: v run source/modules/antono2/vulkan/.github/scripts/binding-headers.vsh stage source/modules/antono2/vulkan
      - name: Build native ImGui library
        working-directory: source/modules/antono2/imgui
        run: v run build_vimgui.vsh --linkage shared --glfw system
      - name: Build and render desktop examples with V3
        run: |
          v run source/demo/scripts/build_desktop.vsh --output "$RUNNER_TEMP" -new-compiler -no-memory-limit \
            -path "$VMODULES/antono2|@vlib|@vmodules" -cc tcc
          v run source/demo/scripts/smoke_desktop.vsh "$RUNNER_TEMP"

  required-checks:
    if: always()
    needs: [ubuntu24, windows2022]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required jobs
        env:
          UBUNTU_RESULT: ${{ needs.ubuntu24.result }}
          WINDOWS_RESULT: ${{ needs.windows2022.result }}
        run: |
          test "$UBUNTU_RESULT" = success
          test "$WINDOWS_RESULT" = success
