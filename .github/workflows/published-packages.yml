name: Published desktop package consumers
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag, or latest'
        default: latest
        type: string
permissions:
  contents: read
jobs:
  package-consumer:
    name: Package consumer (${{ matrix.platform }}, ${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        variant: [docking, standard]
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: |
            desktopsettings/rendering.v
            scripts/test_release_package.vsh
            scripts/run_package_consumer.vsh
            scripts/releaseconsumer/archive.v
            scripts/releaseconsumer/process.v
            scripts/compatibility.vsh
            compatibility.json
            v.mod
          sparse-checkout-cone-mode: false
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
          install-dependencies: false
      - name: Resolve consumer runtime pins
        id: compat
        shell: bash
        run: v run scripts/compatibility.vsh --github-output "$GITHUB_OUTPUT"
      - name: Download published package and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || 'latest' }}
        run: v run scripts/run_package_consumer.vsh download ${{ matrix.platform }} ${{ matrix.variant }}
      - name: Install Windows software Vulkan driver
        if: runner.os == 'Windows'
        uses: antono2/vulkan/.github/actions/setup-vulkan-ci@04620525bab9fd843ad3b9046171aaff4dfe3d3c
        with:
          sdk-version: ${{ steps.compat.outputs.ci_sdk }}
          artifact-tag: ${{ steps.compat.outputs.ci_runtime }}
      - name: Test the desktop package with runtime-only dependencies
        run: v run scripts/run_package_consumer.vsh test ${{ matrix.platform }} ${{ matrix.variant }} --checksums
      - name: Preserve consumer logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: consumer-${{ matrix.platform }}-${{ matrix.variant }}
          path: package-smoke-logs
          if-no-files-found: warn
