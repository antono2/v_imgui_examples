name: Pinned V compiler
description: Build the V compiler and compatibility compiler used by the examples
runs:
  using: composite
  steps:
    - name: Resolve tested compiler pins
      id: compat
      shell: bash
      run: python scripts/compatibility.py --github-output "$GITHUB_OUTPUT"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: vlang/v
        ref: ${{ steps.compat.outputs.v }}
        path: toolchain/v
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: vlang/vc
        ref: ${{ steps.compat.outputs.vc }}
        path: toolchain/v/vc
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: vlang/tccbin
        ref: ${{ steps.compat.outputs.tcc }}
        path: toolchain/v/thirdparty/tcc
    - if: runner.os != 'Windows'
      shell: bash
      run: |
        make -C toolchain/v local=1
        echo "$GITHUB_WORKSPACE/toolchain/v" >> "$GITHUB_PATH"
    - if: runner.os == 'Windows'
      shell: cmd
      working-directory: toolchain/v
      run: makev.bat -msvc --local
    - if: runner.os == 'Windows'
      shell: pwsh
      run: '"$env:GITHUB_WORKSPACE\toolchain\v" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
